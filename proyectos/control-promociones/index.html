<script>
/* ========== Almacenamiento ========== */
const KEY='terreno-promos-demo-2';
const store={
  async get(){ try{ if(window.storage){const r=await window.storage.get(KEY); return r&&r.value?JSON.parse(r.value):null;} }catch(e){}
    try{const v=localStorage.getItem(KEY); return v?JSON.parse(v):null;}catch(e){return null;} },
  async set(o){ const s=JSON.stringify(o);
    try{ if(window.storage){await window.storage.set(KEY,s); return true;} }catch(e){}
    try{ localStorage.setItem(KEY,s); return true;}catch(e){return false;} }
};

/* ========== Constantes ========== */
const PROYECTOS=['Mirador de Bruma','Valle del Faro','Lomas del Alba'];
const proyectosCompletos=(...listas)=>[...new Set(listas.flat().map(x=>String(x??'').trim()).filter(x=>x&&x!=='Todos los proyectos'))]
  .sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
const TIPOS=['Descuento en precio','Pie rebajado','Pie en cuotas','Cuotas sin interés','Bono o regalo',
 'Precio congelado','Plazo extendido','Pack de parcelas','Otra'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const REGIONES=['Arica y Parinacota','Tarapacá','Antofagasta','Atacama','Coquimbo','Valparaíso','Metropolitana',
 'O\u2019Higgins','Maule','Ñuble','Biobío','La Araucanía','Los Ríos','Los Lagos','Aysén','Magallanes'];

const DEF={config:{plan:'Campañas demostrativas',metaGlobal:150000000,valorUF:40000,fechaUF:'',responsables:[{id:'r1',nombre:'Equipo comercial demo'}],proyectos:PROYECTOS.slice()},campanas:[]};

let S=JSON.parse(JSON.stringify(DEF));
let UI={tab:'panel',editando:null,fProyecto:'todos',fEstado:'todos',
  pyProyecto:'todos',pyCampana:'todas',pyHorizonte:24,pyIncluirVencidas:false};

/* ========== Utilidades ========== */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const n=v=>{if(typeof v==='number')return Number.isFinite(v)?v:0;let s=String(v??'').trim().replace(/[^0-9,.-]/g,''); if(!s)return 0;
  const comma=s.lastIndexOf(','),dot=s.lastIndexOf('.');
  if(comma>=0&&dot>=0){const decimal=comma>dot?',':'.';s=s.replace(decimal==='.'?/,/g:/\./g,'').replace(decimal, '.');}
  else if(comma>=0)s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  else if(dot>=0&&s.length-dot-1===3&&s.slice(0,dot)!=='0')s=s.replace('.','');
  const x=Number(s);return Number.isFinite(x)?x:0;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=0)=>new Intl.NumberFormat('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v||0);
const clp=v=>'$'+nf(Math.round(n(v)));
const clpM=v=>{const x=n(v); return Math.abs(x)>=1e6?'$'+nf(x/1e6,1)+'M':'$'+nf(Math.round(x));};
const uf=(v,d=1)=>'UF '+nf(n(v),d);
const montoCampo=v=>String(v??'').trim()===''?'':new Intl.NumberFormat('es-CL',{maximumFractionDigits:2}).format(n(v));
const UFVAL=()=>Math.max(1,n(S.config.valorUF));
const aCLP=(v,u)=>u==='UF'?n(v)*UFVAL():n(v);
const mostrar=(v,u,d)=>u==='UF'?uf(v,d===undefined?1:d):clp(v);

const addM=(ym,k)=>{const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+k,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const diffM=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1);};
const mesCorto=m=>{if(!m)return '—'; const [y,mm]=m.split('-'); return MESES[+mm-1].slice(0,3)+' '+y.slice(2);};
const mesLargo=m=>{if(!m)return '—'; const [y,mm]=m.split('-'); return MESES[+mm-1]+' '+y;};
const fechaCorta=f=>{if(!f)return '—'; const [y,m,d]=f.split('-'); return `${+d} ${MESES[+m-1].slice(0,3)}`;};
const fechaLarga=f=>{if(!f)return 'sin fecha informada';const [y,m,d]=f.split('-');return `${+d} de ${MESES[+m-1].toLowerCase()} de ${y}`;};

const dias=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);

function estadoDe(c){
  if(!c.desde||!c.hasta) return {id:'sinfecha',label:'Sin vigencia',color:'#3B5566'};
  const h=hoyISO();
  if(h<c.desde) return {id:'programada',label:'Programada',color:'#7A4FA3'};
  if(h>c.hasta) return {id:'vencida',label:'Vencida',color:'#A8412B'};
  const r=dias(h,c.hasta);
  if(r<=7) return {id:'porvencer',label:'Por vencer',color:'#C8801C',restan:r};
  return {id:'vigente',label:'Vigente',color:'#0B7C6B',restan:r};
}
const esActiva=c=>['vigente','porvencer','programada'].includes(estadoDe(c).id);

function calcular(c){
  const lista=Math.max(0,n(c.precioLista));
  const descuento=Math.max(0,n(c.descuento));
  const descMonto=Math.min(lista,c.descuentoTipo==='monto'?descuento:lista*Math.min(100,descuento)/100);
  const precio=Math.max(lista-descMonto,0);
  const descPct=lista>0?descMonto/lista*100:0;
  const pieTotal=Math.min(precio*Math.min(100,Math.max(0,n(c.piePct)))/100,precio);
  // La reserva se ingresa siempre en pesos, incluso cuando el contrato está expresado en UF.
  // Es un abono al pie, por lo que no puede descontar más que el pie total.
  const reservaSolicitadaCLP=Math.max(0,n(c.reserva));
  const reservaSolicitada=c.unidad==='UF'?reservaSolicitadaCLP/UFVAL():reservaSolicitadaCLP;
  const reserva=Math.min(reservaSolicitada,pieTotal);
  const reservaCLP=aCLP(reserva,c.unidad);
  const mesesPie=Math.max(1,Math.round(n(c.mesesPie)||1));
  const cuotaPie=Math.max(pieTotal-reserva,0)/mesesPie;
  const saldo=Math.max(precio-pieTotal,0);
  const meses=Math.max(1,Math.round(n(c.plazoMeses)||1));
  const i=Math.max(0,n(c.tasaAnual))/100/12;
  const usaCuoton=c.tieneCuoton==='si'||(!c.tieneCuoton&&n(c.cuoton)>0);
  const cuotonMaximo=saldo*Math.pow(1+i,meses);
  const cuoton=usaCuoton?Math.min(Math.max(0,n(c.cuoton)),cuotonMaximo):0;
  const cuotasRegulares=cuoton>0?Math.max(0,meses-1):meses;
  const saldoCuotas=Math.max(saldo-(i>0?cuoton/Math.pow(1+i,meses):cuoton),0);
  const cuota=cuotasRegulares>0
    ?(i>0?(saldoCuotas*i)/(1-Math.pow(1+i,-cuotasRegulares)):saldoCuotas/cuotasRegulares)
    :0;
  const unidades=Math.max(0,Math.round(n(c.unidades)));
  const metaU=Math.max(0,Math.round(n(c.metaUnidades)));
  const precioCLP=aCLP(precio,c.unidad);
  return {lista,descMonto,descPct,precio,precioCLP,reserva,reservaCLP,reservaSolicitadaCLP,pieTotal,cuotaPie,mesesPie,saldo,saldoCuotas,meses,cuotasRegulares,cuota,cuoton,cuotonMaximo,usaCuoton,
    unidades,metaU,potencialCLP:precioCLP*unidades,objetivoCLP:precioCLP*metaU,
    descuentoComprometidoCLP:aCLP(descMonto,c.unidad)*metaU,pieObjetivoCLP:aCLP(pieTotal,c.unidad)*metaU,
    porM2:n(c.superficie)>0?precio/n(c.superficie):0};
}

function cuotonDesdeCuota(c,valorCuota){
  const k=calcular(Object.assign({},c,{tieneCuoton:'no',cuoton:''}));
  const meses=Math.max(2,k.meses),i=Math.max(0,n(c.tasaAnual))/100/12,cuota=Math.max(0,n(valorCuota));
  let saldo=k.saldo;
  for(let pago=1;pago<meses;pago++)saldo=Math.max(0,saldo*(1+i)-cuota);
  return Math.max(0,saldo*(1+i));
}

function lineaTiempo(cE){
  const fechas=cE.flatMap(x=>[x.c.desde,x.c.hasta]).filter(Boolean).sort();
  if(!fechas.length) return '<p class="fs13 muted">Define las fechas de vigencia para ver la línea de tiempo.</p>';
  const hoy=hoyISO();
  const di=new Date(fechas[0]<hoy?fechas[0]:hoy), df=new Date(fechas[fechas.length-1]>hoy?fechas[fechas.length-1]:hoy);
  di.setDate(di.getDate()-5); df.setDate(df.getDate()+5);
  const total=Math.max(1,(df-di)/86400000);
  const pos=f=>((new Date(f)-di)/86400000)/total*100;
  const marcas=[]; const cur=new Date(di.getFullYear(),di.getMonth(),1);
  while(cur<=df){marcas.push(MESES[cur.getMonth()].slice(0,3)+' '+String(cur.getFullYear()).slice(2)); cur.setMonth(cur.getMonth()+1);}
  return `<div class="tl">
    ${cE.filter(x=>x.c.desde&&x.c.hasta).map(x=>{
      const a=Math.max(0,pos(x.c.desde)),b=Math.min(100,pos(x.c.hasta));
      return `<div class="fila">
        <div class="fs12" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.c.proyecto)}">${esc(x.c.proyecto)}</div>
        <div class="pista"><div class="hoy" style="left:${pos(hoy)}%"></div>
          <div class="vig" style="left:${a}%;width:${Math.max(b-a,1.5)}%;background:${x.e.color}">${esc(x.c.nombre||x.c.tipo)}</div></div></div>`;}).join('')}
    <div class="ejes"><div></div><div class="meses">${marcas.map(m=>`<span>${m}</span>`).join('')}</div></div></div>`;
}

/* ---------- Proyección de ingresos ---------- */
function proyectar(camps,horizonte){
  const start=mesHoy();
  const res=Array.from({length:horizonte},(_,i)=>({mes:addM(start,i),unidades:0,reservas:0,pie:0,cuotas:0,total:0}));
  const detalle=[];
  camps.forEach(c=>{
    const k=calcular(c); if(k.metaU<=0) return;
    let ini=c.desde?ymDe(c.desde):start; if(diffM(start,ini)<0) ini=start;
    let fin=c.hasta?ymDe(c.hasta):ini; if(diffM(ini,fin)<0) fin=ini;
    const meses=[]; let cur=ini,g=0;
    while(diffM(cur,fin)>=0&&g++<180){meses.push(cur);cur=addM(cur,1);}
    const por=k.metaU/meses.length;
    const reservaCLP=aCLP(k.reserva,c.unidad), cuotaPieCLP=aCLP(k.cuotaPie,c.unidad), cuotaCLP=aCLP(k.cuota,c.unidad), cuotonCLP=aCLP(k.cuoton,c.unidad);
    let aporte=0;
    meses.forEach(m=>{
      const t=diffM(start,m); if(t<0) return;
      if(t<horizonte){res[t].unidades+=por; res[t].reservas+=por*reservaCLP; aporte+=por*reservaCLP;}
      const desfase=reservaCLP>0?1:0;
      for(let i=0;i<k.mesesPie;i++){const j=t+desfase+i; if(j>=0&&j<horizonte){res[j].pie+=por*cuotaPieCLP; aporte+=por*cuotaPieCLP;}}
      for(let i=0;i<k.cuotasRegulares;i++){const j=t+desfase+k.mesesPie+i; if(j>=0&&j<horizonte){res[j].cuotas+=por*cuotaCLP; aporte+=por*cuotaCLP;}}
      const mesCuoton=t+desfase+k.mesesPie+k.meses-1;
      if(cuotonCLP>0&&mesCuoton>=0&&mesCuoton<horizonte){res[mesCuoton].cuotas+=por*cuotonCLP;aporte+=por*cuotonCLP;}
    });
    detalle.push({c,k,aporte,mesesVenta:meses.length,porMes:por});
  });
  let acum=0;
  res.forEach(r=>{r.total=r.reservas+r.pie+r.cuotas; acum+=r.total; r.acum=acum;});
  return {res,detalle};
}

    descargar('\ufeff'+[cab,...filas].map(f=>f.map(x=>`"${x}"`).join(';')).join('\n'),'proyeccion-ingresos.csv','text/csv;charset=utf-8;');

function graficoFlujo(res){
  const max=Math.max(1,...res.map(r=>r.total));
  const W=Math.max(340,res.length*36),H=210,pad=30,base=H-34,bw=(W-pad)/res.length;
  const barras=res.map((r,i)=>{
    const x=pad+i*bw, w=Math.max(bw-8,3);
    const hp=(base-14)*((r.reservas+r.pie)/max), hc=(base-14)*(r.cuotas/max);
    return `<rect x="${x}" y="${base-hc}" width="${w}" height="${hc}" fill="#0B7C6B" rx="2"></rect>
      <rect x="${x}" y="${base-hc-hp}" width="${w}" height="${hp}" fill="#C8801C" rx="2"></rect>
      ${i%3===0?`<text x="${x+w/2}" y="${H-16}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#3B5566">${mesCorto(r.mes)}</text>`:''}`;
  }).join('');
  const puntos=res.map((r,i)=>`${pad+i*bw+(bw-8)/2},${base-(base-14)*(r.acum/res[res.length-1].acum||0)*0.92}`).join(' ');
  return `<div style="overflow-x:auto;margin-top:10px"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">
    <line x1="${pad}" y1="${base}" x2="${W}" y2="${base}" stroke="#C9D4DA"></line>
    <text x="0" y="${base}" font-family="IBM Plex Mono" font-size="9" fill="#3B5566">0</text>
    <text x="0" y="20" font-family="IBM Plex Mono" font-size="9" fill="#3B5566">${clpM(max)}</text>
    ${barras}
    <polyline points="${puntos}" fill="none" stroke="#0D1B26" stroke-width="1.5" stroke-dasharray="3 3" opacity=".55"></polyline>
  </svg></div>
  <div class="row mono fs11 muted" style="gap:14px;margin-top:6px">
    <span><i style="display:inline-block;width:9px;height:9px;background:#C8801C;border-radius:2px"></i> Pie y reservas</span>
    <span><i style="display:inline-block;width:9px;height:9px;background:#0B7C6B;border-radius:2px"></i> Cuotas del saldo</span>
    <span>línea punteada: acumulado</span></div>`;
}

    document.getElementById('f_regaloPromocion').disabled=!activo;

  cuotaNormalCLPEl.addEventListener('input',()=>{

    cuotaNormalEl.value=montoCampo(c.cuotaNormal);c.cuotonModo='auto';recalcularCuoton('cuota');prev();
  });
  cuotonEl.addEventListener('input',()=>{
    c.cuoton=cuotonEl.value;c.cuotonModo='manual';actualizarCuotaDesdeCuoton();prev();
  });
  cuotonCLPEl.addEventListener('input',()=>{
    c.cuoton=Math.round(n(cuotonCLPEl.value)/UFVAL()*1000000)/1000000;
    cuotonEl.value=montoCampo(c.cuoton);c.cuotonModo='manual';actualizarCuotaDesdeCuoton('cuoton');prev();
  });
  document.querySelectorAll('[data-money]').forEach(el=>{
    el.addEventListener('focus',()=>{if(String(el.value).trim()!=='')el.value=String(n(el.value)).replace('.',',');});
    el.addEventListener('blur',()=>{el.value=montoCampo(el.value);});
  });
  actualizarCuoton();
  actualizarRegalo();
  if(c.tieneCuoton==='si')c.cuotonModo==='manual'?actualizarCuotaDesdeCuoton():recalcularCuoton();
  function prev(){const k=calcular(c);
    document.getElementById('prev').innerHTML=`<div class="g4 finance-grid finance-primary">
        ${stat('Precio promo',mostrar(k.precio,c.unidad,0),c.unidad==='UF'?clp(k.precioCLP):'')}
        ${stat('Reserva',k.reservaCLP?clp(k.reservaCLP):'—',k.reservaCLP?'abono al pie':'sin reserva')}
        ${stat('Pie',(k.mesesPie===1?'1 pago':k.mesesPie+' pagos')+' de '+mostrar(k.cuotaPie,c.unidad,2),(c.unidad==='UF'?clp(aCLP(k.cuotaPie,c.unidad))+' cada pago\n':'')+'Pie total: '+mostrar(k.pieTotal,c.unidad,2)+(c.unidad==='UF'?' · '+clp(aCLP(k.pieTotal,c.unidad)):'')+' · '+n(c.piePct)+'%')}
        ${stat('Cuota normal',mostrar(k.cuota,c.unidad,2),(c.unidad==='UF'?clp(aCLP(k.cuota,c.unidad))+' · ':'')+(k.cuoton>0?k.cuotasRegulares+' pagos':k.meses+' pagos'))}</div>
      <div class="g4 finance-grid finance-secondary">
        ${stat('Cuotón final',k.cuoton>0?mostrar(k.cuoton,c.unidad,2):'—',k.cuoton>0?(c.unidad==='UF'?clp(aCLP(k.cuoton,c.unidad))+' · ':'')+'pago nº '+k.meses:'sin cuotón')}
        ${stat('Valor m²',k.porM2?mostrar(k.porM2,c.unidad,3):'—',c.unidad==='UF'&&k.porM2?clp(aCLP(k.porM2,c.unidad)):'' )}
        ${stat('Objetivo de venta',clpM(k.objetivoCLP),k.metaU+' parcelas')}
        ${stat('Potencial total',clpM(k.potencialCLP),k.unidades+' en stock')}
        </div>`;}
  prev();
  document.getElementById('cancel').onclick=()=>{UI.editando=null;render();};
  document.getElementById('save').onclick=async()=>{
    const errores=[];
    if(c.tieneCuoton!=='si'){c.cuotaNormal='';c.cuoton='';c.cuotonModo='auto';}
    if(c.tieneRegalo!=='si')c.regaloPromocion='';
    if(c.tieneRegalo==='si'&&!String(c.regaloPromocion||'').trim())errores.push('Describe el regalo promocional o selecciona No.');
    if(!String(c.proyecto||'').trim())errores.push('Selecciona un proyecto.');
    if(!String(c.nombre||'').trim())errores.push('Escribe un título para la campaña.');
    if(!(n(c.precioLista)>0))errores.push('El precio de lista debe ser mayor que cero.');
    if(c.desde&&c.hasta&&c.hasta<c.desde)errores.push('La fecha final no puede ser anterior al inicio.');
    if(n(c.unidades)>0&&n(c.metaUnidades)>n(c.unidades))errores.push('La meta a vender no puede superar el stock en promoción.');
    if(n(c.descuento)<0||n(c.reserva)<0||n(c.piePct)<0||n(c.tasaAnual)<0||n(c.cuotaNormal)<0||n(c.cuoton)<0)errores.push('Los montos y porcentajes no pueden ser negativos.');
    if(n(c.reserva)>aCLP(calcular(c).pieTotal,c.unidad))errores.push('La reserva no puede superar el pie total de '+clp(aCLP(calcular(c).pieTotal,c.unidad))+'.');
    if(c.tieneCuoton==='si'&&!(n(c.cuotaNormal)>0))errores.push('Ingresa el valor de la cuota normal.');
    if(c.tieneCuoton==='si'&&!(n(c.cuoton)>0))errores.push('La cuota normal debe dejar un saldo positivo para el cuotón.');
    if(n(c.cuoton)>calcular(c).cuotonMaximo)errores.push('El cuotón supera el saldo final disponible.');
    if(c.tieneCuoton==='si'&&Math.round(n(c.plazoMeses))<2)errores.push('El plazo debe tener al menos 2 pagos cuando existe cuotón.');
    if(errores.length){const box=document.getElementById('formError');box.hidden=false;box.innerHTML='<strong>Revisa antes de guardar:</strong><br>'+errores.map(esc).join('<br>');box.scrollIntoView({behavior:'smooth',block:'center'});return;}
    const i=S.campanas.findIndex(x=>x.id===c.id);
    if(i>=0) S.campanas[i]=c; else S.campanas.unshift(c);
    UI.editando=null; await guardar(); render();};
}

/* ---------- Ficha ---------- */
function textoFicha(c){
  const k=calcular(c),L=[],esUF=c.unidad==='UF';
  const valor=(monto,decimales=2)=>esUF
    ?`${nf(monto,decimales)} UF (~${clp(aCLP(monto,'UF'))} CLP referencial)`
    :clp(monto);
  const totalCuotasNormales=k.cuota*k.cuotasRegulares;
  const inicioSaldo=k.mesesPie+1,finCuotasNormales=k.mesesPie+k.cuotasRegulares,finPlan=k.mesesPie+k.meses;
  const singular=(cantidad,uno,varios)=>cantidad===1?uno:varios;

  L.push(`🏡 *OPORTUNIDAD EN ${String(c.proyecto||'').toUpperCase()}*`);
  if(n(c.superficie)>0)L.push(`Superficie tipo: ${nf(n(c.superficie))} m²`);
  L.push('');
  if(k.descMonto>0){
    L.push(`*Precio de lista:* ${valor(k.lista,0)}`);
    L.push(`*Descuento:* ${valor(k.descMonto,0)} (${nf(k.descPct,1)}%)`);
  }
  L.push(`*Precio promoción:* ${valor(k.precio,0)}`);
  if(c.desde&&c.hasta){L.push('');L.push(`*Vigencia de la promoción:* ${fechaLarga(c.desde)} al ${fechaLarga(c.hasta)}`);}
  L.push('');
  L.push('💳 *DESGLOSE Y ETAPAS DEL PLAN DE PAGO*');
  L.push('');
  L.push('1️⃣ *RESERVA Y ASEGURAMIENTO DEL LOTE*');
  L.push(k.reservaCLP>0
    ?`Monto de reserva: ${esUF?`${nf(k.reserva,2)} UF (~${clp(k.reservaCLP)} CLP)`:clp(k.reservaCLP)}`
    :'Sin reserva informada.');
  if(k.reservaCLP>0){L.push('');L.push('Este valor se descuenta íntegramente del monto total de tu pie.');}
  L.push('');
  L.push(`2️⃣ *ETAPA 1: PAGO DEL PIE (${k.mesesPie} ${singular(k.mesesPie,'MES','MESES')})*`);
  L.push(`Pie total (${nf(n(c.piePct),1)}% del valor): ${valor(k.pieTotal,2)}`);
  L.push('');
  L.push(`Cómo lo pagas: en ${k.mesesPie} ${singular(k.mesesPie,'cuota mensual','cuotas mensuales')} de ${valor(k.cuotaPie,2)}.`);
  if(k.mesesPie>1){L.push('');L.push(`💡 *Beneficio:* distribuyes el pago de tu pie durante ${k.mesesPie} meses, en lugar de pagarlo completo al inicio.`);}
  L.push('');
  L.push('3️⃣ *ETAPA 2: FINANCIAMIENTO DEL SALDO (SITIO)*');
  L.push(`Una vez completado el pie, se activa el financiamiento directo del ${nf(Math.max(0,100-n(c.piePct)),1)}% restante: ${valor(k.saldo,2)}.`);
  L.push('');
  L.push(`${k.cuotasRegulares} ${singular(k.cuotasRegulares,'cuota fija directa','cuotas fijas directas')}${n(c.tasaAnual)>0?` con tasa anual de ${nf(n(c.tasaAnual),1)}%`:' sin interés'}: ${valor(k.cuota,2)} por mes.`);
  L.push('');
  L.push(`Total acumulado en cuotas normales: ${valor(totalCuotasNormales,2)}.`);
  if(k.cuoton>0){L.push('');L.push(`*Cuotón / último pago · cuota n.º ${k.meses}:* ${valor(k.cuoton,2)}.`);}
  if(c.tieneRegalo==='si'&&String(c.regaloPromocion||'').trim()){
    L.push('');
    L.push(`🎁 *REGALO PROMOCIONAL:* ${String(c.regaloPromocion).trim()}`);
  }
  L.push('');
  L.push('📌 *RESUMEN DEL TIEMPO Y COBROS*');
  L.push(`${k.mesesPie===1?'Mes 1':`Meses 1 al ${k.mesesPie}`}: pagas ${singular(k.mesesPie,'la cuota','las cuotas')} del pie (${mostrar(k.cuotaPie,c.unidad,2)} por mes).`);
  if(k.cuotasRegulares>0)L.push(`${inicioSaldo===finCuotasNormales?`Mes ${inicioSaldo}`:`Meses ${inicioSaldo} al ${finCuotasNormales}`}: pagas la cuota mensual del sitio (${mostrar(k.cuota,c.unidad,2)} por mes).`);
  if(k.cuoton>0)L.push(`Mes ${finPlan} (cuotón): cancelas el último pago (${mostrar(k.cuoton,c.unidad,2)}).`);
  if(c.condiciones){L.push('');L.push('*Condiciones de la promoción:*');c.condiciones.split('\n').filter(Boolean).forEach(x=>L.push('• '+x));}
  if(esUF){L.push('');L.push(`⚠️ *IMPORTANTE:* todos los valores expresados en pesos (CLP) son referenciales. Se calcularon con la UF del ${fechaLarga(S.config.fechaUF)} (${clp(UFVAL())}). Como la UF cambia diariamente, el monto definitivo en pesos se recalculará usando la UF vigente al momento de cada pago.`);}
  return L.join('\n');
}
function abrirFicha(id){
  const c=S.campanas.find(x=>x.id===id); if(!c) return;
  const k=calcular(c),e=estadoDe(c),totalCuotasNormales=k.cuota*k.cuotasRegulares;
  const esUF=c.unidad==='UF',inicioSaldo=k.mesesPie+1,finCuotasNormales=k.mesesPie+k.cuotasRegulares,finPlan=k.mesesPie+k.meses;
  const montoUFTabla=valor=>esUF?mostrar(valor,'UF',2):'—';
  const montoCLPTabla=valor=>clp(aCLP(valor,c.unidad));
  const detalleCuota=(valor,cantidad)=>`${cantidad} ${cantidad===1?'cuota':'cuotas'} de ${mostrar(valor,c.unidad,2)}${esUF?' ('+clp(aCLP(valor,c.unidad))+'/mes)':''}`;
  const timelineMonto=valor=>`${mostrar(valor,c.unidad,2)}${esUF?' (~'+clp(aCLP(valor,c.unidad))+' CLP)':''}`;
  const m=document.createElement('div'); m.className='modal ficha-modal';

    <div class="row" style="justify-content:space-between;align-items:flex-start">

        <div style="font-family:var(--disp);font-size:22px;line-height:1.1;margin-top:4px">${esc(c.proyecto)}</div></div>${tagEstado(e)}</div>
    <div class="g4 finance-grid finance-primary">
      ${stat(k.descMonto>0?'Precio promocional':'Precio',mostrar(k.precio,c.unidad,0),(k.descMonto>0?'Precio de lista anterior: '+mostrar(k.lista,c.unidad,0)+'\nAhorro: '+mostrar(k.descMonto,c.unidad,0)+' · '+nf(k.descPct,1)+'%'+(c.unidad==='UF'?'\n':''):'')+(c.unidad==='UF'?'Equivalencia referencial: '+clp(k.precioCLP):''))}
      ${stat('Reserva inicial',k.reservaCLP?clp(k.reservaCLP):'—',k.reservaCLP?(c.unidad==='UF'?'Equivale a '+mostrar(k.reserva,c.unidad,2)+'\n':'')+'Se descuenta del pie':'Sin reserva informada')}
      ${stat('Pie total · '+n(c.piePct)+'%',mostrar(k.pieTotal,c.unidad,2),(k.reservaCLP?'Incluye la reserva + ':'')+k.mesesPie+' '+(k.mesesPie===1?'cuota':'cuotas')+' de '+mostrar(k.cuotaPie,c.unidad,2)+(c.unidad==='UF'?'\nCada cuota ≈ '+clp(aCLP(k.cuotaPie,c.unidad))+' · total ≈ '+clp(aCLP(k.pieTotal,c.unidad)):''))}
      ${stat('Pago mensual del saldo',mostrar(k.cuota,c.unidad,2),(c.unidad==='UF'?'Equivale a ≈ '+clp(aCLP(k.cuota,c.unidad))+' por mes\n':'')+k.cuotasRegulares+' '+(k.cuotasRegulares===1?'cuota normal':'cuotas normales')+' · '+(n(c.tasaAnual)>0?n(c.tasaAnual)+'% anual':'sin interés')+'\nTotal: '+mostrar(totalCuotasNormales,c.unidad,2)+(c.unidad==='UF'?' · ≈ '+clp(aCLP(totalCuotasNormales,c.unidad)):''))}
      </div>
    <div class="g4 finance-grid finance-secondary">
      ${stat('Saldo total a financiar · '+nf(Math.max(0,100-n(c.piePct)),1)+'%',mostrar(k.saldo,c.unidad,2),c.unidad==='UF'?'Equivalencia referencial: '+clp(aCLP(k.saldo,c.unidad)):'Monto financiado después del pie')}
      ${stat('Último pago / cuotón',k.cuoton>0?mostrar(k.cuoton,c.unidad,2):'—',k.cuoton>0?(c.unidad==='UF'?'Equivale a ≈ '+clp(aCLP(k.cuoton,c.unidad))+'\n':'')+'Cuota n.º '+k.meses+' · mes '+finPlan+' del plan':'Esta promoción no tiene cuotón')}

    ${c.condiciones?`<div class="sep"><div class="eyebrow">Condiciones</div>

    ${c.unidad==='UF'?`<div class="uf-reference"><strong>⚠ Valores referenciales en pesos:</strong> calculados con la UF del ${esc(fechaLarga(S.config.fechaUF))} = <strong>${clp(UFVAL())}</strong>.<br>La UF cambia diariamente; el monto definitivo en pesos se recalcula con la UF vigente al momento de cada pago.</div>`:''}

      <button class="btn sm ghost" id="copiar">Copiar para WhatsApp</button>
      <button class="btn sm ghost" id="imprimir">Imprimir</button>
      <button class="btn sm" id="cerrar">Cerrar</button></div></div>`;
  m.onclick=ev=>{if(ev.target===m) m.remove();};
  document.body.appendChild(m);
  m.querySelector('#cerrar').onclick=()=>m.remove();
  m.querySelector('#imprimir').onclick=()=>window.print();
  m.querySelector('#copiar').onclick=async()=>{
    const t=textoFicha(c);
    try{await navigator.clipboard.writeText(t); m.querySelector('#copiar').textContent='Copiado';}
    catch(e){const ta=document.createElement('textarea'); ta.value=t; ta.rows=10; ta.className='mono fs11';
      m.querySelector('#ficha').appendChild(ta); ta.select();}};
}

        Las campañas y la configuración se guardan en la base de datos compartida. Este navegador conserva solamente una copia auxiliar.
      </div>
      <p class="fs12 muted" style="margin:0 0 12px">Puedes descargar un respaldo manual o restaurarlo. Al restaurar o borrar datos, el cambio también se sincroniza con Firebase.</p>
      <div class="row">
        <button class="btn sm ghost" id="expJSON">Descargar respaldo</button>
        <button class="btn sm ghost" id="impJSON">Restaurar respaldo</button>
        <button class="btn sm ghost" id="expCSV">Exportar promociones CSV</button></div>
      <input type="file" id="fileJSON" accept="application/json" style="display:none">
      <div class="sep"><button class="btn sm danger" id="wipe">Borrar todos los datos</button></div></div></div>`;
  const bind=(id,k,num)=>{const el=document.getElementById(id);
    el.onchange=async()=>{cf[k]=num?n(el.value):el.value; await guardar(); render();};};
  bind('c_plan','plan'); bind('c_meta','metaGlobal',true); bind('c_uf','valorUF',true); bind('c_fuf','fechaUF');
  document.getElementById('refreshUF').onclick=async e=>{e.currentTarget.disabled=true;e.currentTarget.textContent='Consultando…';await actualizarUF(true);};
  v.querySelectorAll('[data-rn]').forEach(i=>i.onchange=async()=>{cf.responsables.find(r=>r.id===i.dataset.rn).nombre=i.value; await guardar();});
  v.querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{
    if(cf.responsables.length<=1){alert('Deja al menos un responsable.');return;}
    cf.responsables=cf.responsables.filter(r=>r.id!==b.dataset.rd); await guardar(); panelConfig(v);});
  document.getElementById('addResp').onclick=async()=>{cf.responsables.push({id:uid(),nombre:''}); await guardar(); panelConfig(v);};
  v.querySelectorAll('[data-pn]').forEach(i=>i.onchange=async()=>{cf.proyectos[+i.dataset.pn]=i.value; await guardar();});
  v.querySelectorAll('[data-pd]').forEach(b=>b.onclick=async()=>{cf.proyectos.splice(+b.dataset.pd,1); await guardar(); panelConfig(v);});
  document.getElementById('addProy').onclick=async()=>{cf.proyectos.push('Nuevo proyecto'); await guardar(); panelConfig(v);};
  document.getElementById('resetProy').onclick=async()=>{
    if(!confirm('Se reemplaza el listado por el original de 3 proyectos de ejemplo. ¿Seguir?')) return;
    cf.proyectos=PROYECTOS.slice(); await guardar(); panelConfig(v);};
  document.getElementById('expJSON').onclick=()=>descargar(JSON.stringify(S,null,2),'respaldo-promociones-'+hoyISO()+'.json','application/json');
  document.getElementById('expCSV').onclick=exportarCSV;
  document.getElementById('impJSON').onclick=()=>document.getElementById('fileJSON').click();
  document.getElementById('fileJSON').onchange=e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=async()=>{try{const d=JSON.parse(r.result); if(!d.campanas) throw 0;
      if(!confirm('Esto reemplaza los datos actuales. ¿Seguir?')) return;
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);
      S.config=Object.assign(JSON.parse(JSON.stringify(DEF.config)),d.config||{});
      await guardar(); UI.tab='panel'; render();}catch(err){alert('El archivo no es un respaldo válido.');}};
    r.readAsText(f);};
  document.getElementById('wipe').onclick=async()=>{
    if(!confirm('Se borran todas las promociones y la configuración. ¿Seguro?')) return;
    S=JSON.parse(JSON.stringify(DEF)); await guardar(); UI.tab='panel'; render();};
}

function descargar(txt,nombre,tipo){
  try{const url=URL.createObjectURL(new Blob([txt],{type:tipo}));
    const a=document.createElement('a'); a.href=url; a.download=nombre; a.click(); URL.revokeObjectURL(url);
  }catch(e){
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="card" style="max-width:560px;width:100%"><div class="eyebrow">Copia este contenido</div>
      <textarea rows="9" class="mono" style="font-size:11px;margin-top:8px">${esc(txt)}</textarea>
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sm">Cerrar</button></div></div>`;
    m.onclick=ev=>{if(ev.target===m||ev.target.tagName==='BUTTON')m.remove();};
    document.body.appendChild(m);}
}
function exportarCSV(){
  const cab=['Proyecto','Campana','Tipo','Desde','Hasta','Estado','Responsable','Unidad','PrecioLista','Descuento',
    'PrecioPromo','PrecioPromoCLP','PiePct','PieMonto','CuotasPie','PlazoTotal','TieneCuoton','CuotasRegulares','Cuota','CuotonFinal','Stock','MetaUnidades',
    'ObjetivoCLP','PotencialCLP','Objetivo','Condiciones'];
  const filas=S.campanas.map(c=>{const k=calcular(c);
    return [c.proyecto,c.nombre,c.tipo,c.desde,c.hasta,estadoDe(c).label,respNombre(c.responsableId),c.unidad,
      n(c.precioLista),c.descuentoTipo==='pct'?n(c.descuento)+'%':n(c.descuento),Math.round(k.precio),Math.round(k.precioCLP),
      n(c.piePct),Math.round(k.pieTotal),k.mesesPie,k.meses,k.usaCuoton?'Sí':'No',k.cuotasRegulares,Math.round(k.cuota),Math.round(k.cuoton),k.unidades,k.metaU,
      Math.round(k.objetivoCLP),Math.round(k.potencialCLP),String(c.objetivo||''),String(c.condiciones||'').replace(/[\n;]/g,' / ')];});
  descargar('\ufeff'+[cab,...filas].map(f=>f.map(x=>`"${String(x??'')}"`).join(';')).join('\n'),
    'promociones-tc1000.csv','text/csv;charset=utf-8;');
}

/* ========== Integración con el portal y Firebase ========== */
function normalizarEstado(datos){
  const base=JSON.parse(JSON.stringify(DEF)),saved=datos&&typeof datos==='object'?datos:{};
  const next=Object.assign(base,saved);
  next.config=Object.assign(base.config,saved.config||{});
  next.campanas=Array.isArray(saved.campanas)?saved.campanas.map(c=>Object.assign({
    tieneCuoton:n(c?.cuoton)>0?'si':'no',cuotaNormal:'',cuoton:'',cuotonModo:n(c?.cuoton)>0?'manual':'auto'
  },c,{
    tieneCuoton:['si','no'].includes(c?.tieneCuoton)?c.tieneCuoton:(n(c?.cuoton)>0?'si':'no'),
    cuotonModo:['auto','manual'].includes(c?.cuotonModo)?c.cuotonModo:(n(c?.cuoton)>0?'manual':'auto')
  })):[];
  next.config.proyectos=proyectosCompletos(PROYECTOS,next.config.proyectos||[],next.campanas.map(c=>c.proyecto));
  if(!Array.isArray(next.config.responsables)||!next.config.responsables.length)next.config.responsables=base.config.responsables;
  return next;
}
window.VICAPER_PROMOTIONS_API={
  getData:()=>JSON.parse(JSON.stringify(S)),
  replaceData:data=>{S=normalizarEstado(data);UI.editando=null;render();actualizarUF(true);},
  mergeProjects:names=>{
    const merged=proyectosCompletos(S.config.proyectos||[],names||[],S.campanas.map(c=>c.proyecto));
    if(JSON.stringify(merged)===JSON.stringify(S.config.proyectos||[]))return false;
    S.config.proyectos=merged;render();return true;
  },
  refreshUF:()=>actualizarUF(true)
};
window.addEventListener('vicaper-access-ready',()=>{render();actualizarUF(true);});
